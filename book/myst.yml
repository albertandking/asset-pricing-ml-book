version: 1
project:
  title: 资产定价与机器学习：从理论到 A 股实证
  subtitle: 自包含教材
  description: 面向资产定价方向研究者的自包含中文教材：资产定价理论、实证计量、横截面实证与机器学习资产定价，全书用已知真值的模拟 A 股市场检验每一种方法。
  keywords:
    - 资产定价
    - 机器学习
    - A 股
    - 因子模型
    - 随机贴现因子
    - Fama–MacBeth
  github: https://github.com/albertandking/asset-pricing-ml-book
  license:
    content: CC-BY-NC-SA-4.0
    code: MIT
  bibliography:
    - references.bib
  math:
    '\E': '\mathbb{E}'
    '\Var': '\operatorname{Var}'
    '\Cov': '\operatorname{Cov}'
    '\Real': '\mathbb{R}'
    # 希腊字母向量与矩阵的粗体，如 \bv\beta、\bv{\Gamma}；拉丁字母直接用 \mathbf
    '\bv': '\boldsymbol{#1}'
  numbering:
    equation: true
    figure: true
    table: true
  toc:
    - file: index.md
    - file: notation.md
    - file: glossary.md
    - title: 第零部分　准备
      children:
        - file: part0/ch00-guide.md
          children:
            - file: part0/ch00-concepts.md
            - file: part0/ch00-relations.md
            - file: part0/ch00-model.md
            - file: part0/ch00-experiments.md
            - file: part0/ch00-exercises.md
        # 导读页：第二部分的预习，不属于第 0 章，不编号
        - file: part0/primer-regressions.md
    - title: 第一部分　资产定价理论
      children:
        - file: part1/ch01-euler-sdf.md
          children:
            - file: part1/ch01-lognormal.md
            - file: part1/ch01-lucas.md
            - file: part1/ch01-experiments.md
            - file: part1/ch01-exercises.md
site:
  # 固定为 @myst-theme/book 1.4.1（myst-templates/book-theme 提交 23f2df5，“v1.4.1 from 1c3581d”）
  template: https://github.com/myst-templates/book-theme/archive/23f2df5493e23dfb1d9433c8aa64c87beb4232a3.zip
  options:
    style: _static/custom.css
    # 图标：散点与拟合线，源文件为 _static/logo.svg；favicon.ico 由同一几何图形生成（16～64 像素）
    favicon: _static/favicon.ico
    logo: _static/logo.svg
    logo_alt: 资产定价与机器学习
    # 左上角显示书名（不设置时主题显示“Made with MyST”）
    logo_text: 资产定价与机器学习：从理论到 A 股实证
