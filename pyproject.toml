[project]
name = "apsim"
version = "0.1.0"
description = "《资产定价与机器学习：从理论到 A 股实证》配套模拟与工具包"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "sympy>=1.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ipykernel>=6.29",
    "jupyter-book==2.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
